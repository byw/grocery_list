<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#121212">
<title>Groceries</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; }
  body { margin: 0 auto; max-width: 40rem; padding: 1rem; }
  form { display: flex; gap: .5rem; position: sticky; top: 0; background: Canvas; padding-bottom: .5rem; }
  input { flex: 1; font-size: 1.1rem; padding: .6rem; }
  button { font-size: 1.1rem; padding: .6rem .9rem; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; gap: .5rem; padding: .8rem .2rem; border-bottom: 1px solid color-mix(in srgb, CanvasText 15%, transparent); font-size: 1.2rem; }
  li span { flex: 1; cursor: pointer; }
  li.done span { text-decoration: line-through; opacity: .5; }
  li button { background: none; border: none; opacity: .5; }
</style>
</head>
<body>
<form id="add">
  <input id="name" list="hist" placeholder="Add item" autocomplete="off" required autofocus>
  <datalist id="hist"></datalist>
  <button type="submit">Add</button>
</form>
<ul id="list"></ul>
<script type="module" src="app.js"></script>
</body>
</html>
