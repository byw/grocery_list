<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Groceries</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root {
    color-scheme: dark;
    --bg: #111;
    --fg: #ececec;
    --mute: #6f6f6f;
    --rule: #2a2a2a;
    --red: #e04a3f;
    --yellow: #e6b422;
    --teal: #2fb3a3;
    --blue: #3d7be0;
    font-family: "Helvetica Neue", Helvetica, Inter, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto; max-width: 34rem; min-height: 100vh;
    padding: env(safe-area-inset-top) 1.25rem calc(4rem + env(safe-area-inset-bottom));
    background: var(--bg); color: var(--fg);
  }
  /* technicolour stripe */
  body::before {
    content: ""; display: block; height: 3px; margin: 1.5rem 0 2.5rem;
    background: linear-gradient(90deg, var(--red) 0 25%, var(--yellow) 25% 50%, var(--teal) 50% 75%, var(--blue) 75%);
  }
  header { display: grid; grid-template-columns: 1fr auto; align-items: end; margin-bottom: 2rem; }
  h1 { margin: 0; font-size: .75rem; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--mute); }
  #count { margin: 0; font-size: 4.5rem; line-height: .85; font-weight: 700; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }

  form { display: grid; grid-template-columns: 1fr auto; gap: 1rem; margin-bottom: 1.5rem; }
  input {
    font: inherit; font-size: 1.25rem; padding: .6rem 0;
    background: none; border: 0; border-bottom: 1px solid var(--fg); border-radius: 0; color: var(--fg);
  }
  input::placeholder { color: var(--mute); }
  input::-webkit-calendar-picker-indicator { display: none; }
  input:focus { outline: none; border-bottom-color: var(--yellow); }
  button {
    font: inherit; font-size: .75rem; font-weight: 500; letter-spacing: .18em; text-transform: uppercase;
    background: none; border: 1px solid var(--fg); border-radius: 0; color: var(--fg); padding: 0 1rem; cursor: pointer;
  }
  button:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }
  form button:active { background: var(--fg); color: var(--bg); }

  ul { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--rule); }
  li { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 1rem; padding: .9rem 0; border-bottom: 1px solid var(--rule); font-size: 1.25rem; }
  /* retro technicolour: dot colour cycles per row */
  li::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--c, var(--fg)); }
  li:nth-child(4n+1) { --c: var(--red); }
  li:nth-child(4n+2) { --c: var(--yellow); }
  li:nth-child(4n+3) { --c: var(--teal); }
  li:nth-child(4n+4) { --c: var(--blue); }
  li span { cursor: pointer; user-select: none; }
  li.done::before { background: var(--c); }
  li.done span { text-decoration: line-through; text-decoration-color: var(--c); color: var(--mute); }
  li button { border: 0; padding: .25rem .5rem; color: var(--mute); font-size: 1.1rem; letter-spacing: 0; }
  li button:hover { color: var(--red); }
  li button:active { background: none; }
  ul:empty::after { content: "Nothing to buy."; display: block; padding: 2rem 0; color: var(--mute); font-size: .9rem; }
</style>
</head>
<body>
<header>
  <h1>Groceries</h1>
  <p id="count">0</p>
</header>
<form id="add">
  <input id="name" list="hist" placeholder="Add item" autocomplete="off" required autofocus aria-label="Item name">
  <datalist id="hist"></datalist>
  <button type="submit">Add</button>
</form>
<ul id="list"></ul>
<script type="module" src="app.js"></script>
</body>
</html>
